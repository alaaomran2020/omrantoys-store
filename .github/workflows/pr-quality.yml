name: PR Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [architecture/storefront-product-engine]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Regression tests
        run: npm test -- --run
