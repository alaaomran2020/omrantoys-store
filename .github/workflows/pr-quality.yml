name: PR Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [architecture/storefront-product-engine]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Regression — Product Engine contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { adaptEngineProduct } from './src/lib/productEngine.js';

          const inquiry = adaptEngineProduct({ id: 'P-1', name: 'منتج استفسار', price: null, category: 'toys', active: true });
          assert.equal(inquiry.price, null);
          assert.equal(inquiry.stock, null);
          assert.equal(inquiry.sku, '');

          const priced = adaptEngineProduct({ id: 'P-2', name: 'منتج مسعر', price: 350, category: 'toys', active: true });
          assert.equal(priced.price, 350);
          assert.equal(priced.retail_price, 350);
          assert.equal(priced.stock, null);

          assert.equal(adaptEngineProduct({ id: '', name: 'invalid' }), null);
          assert.equal(adaptEngineProduct({ id: 'P-3', name: '' }), null);
          console.log('Product Engine adapter regression: PASS');
          NODE
      - name: Regression — capability-aware StoreContext
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const source = fs.readFileSync('src/context/StoreContext.jsx', 'utf8');
          assert.match(source, /fetchStorefrontProducts/);
          assert.match(source, /priceKnown/);
          assert.match(source, /stockKnown/);
          assert.match(source, /canCheckout/);
          assert.match(source, /inquiryOnly/);
          assert.match(source, /availability: !stockKnown \? 'unknown'/);
          assert.match(source, /للاستفسار والكميات/);
          assert.match(source, /const checkoutEligible = cart\.length > 0 && cart\.every/);
          assert.match(source, /if \(!checkoutEligible\)/);
          assert.doesNotMatch(source, /const stockLimit = Number\(product\.stock\) > 0 \? Number\(product\.stock\) : 0/);
          console.log('StoreContext capability regression: PASS');
          NODE
      - name: Regression — critical storefront surfaces compile
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            src/components/product/ProductCard.jsx \
            src/components/product/ProductGrid.jsx \
            src/components/checkout/CheckoutModal.jsx \
            src/components/admin/sections/Products.jsx; do
            test -f "$file"
          done
          grep -q "advancedFilters" src/context/StoreContext.jsx
          grep -q "addToCart" src/context/StoreContext.jsx
          grep -q "placeOrder" src/context/StoreContext.jsx
          echo "Product Card / Cart / Checkout / Filters / Admin surface regression: PASS"
