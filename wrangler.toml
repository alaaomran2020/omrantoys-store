name = "omrantoys-store"
main = "src/index.ts"
compatibility_date = "2026-08-31"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "omran-store-db"
database_id = "6471bcf0-7bf7-4de6-8858-0463c8ff2b31"
migrations_dir = "migrations"
